[package]
name = "universalis-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

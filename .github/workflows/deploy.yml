name: Deploy international site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-items:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check items.json freshness
        run: |
          LOCAL_COMMIT=$(cat data/items-version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['commit'])")
          echo "Local items.json commit: $LOCAL_COMMIT"

          REMOTE_COMMIT=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/thewakingsands/ffxiv-datamining-cn/commits?path=Item.csv&per_page=1" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)[0]['sha'][:12])")
          echo "Remote Item.csv latest commit: $REMOTE_COMMIT"

          if [ "$LOCAL_COMMIT" != "$REMOTE_COMMIT" ]; then
            echo ""
            echo "ERROR: items.json is outdated!"
            echo "  Local:  $LOCAL_COMMIT"
            echo "  Remote: $REMOTE_COMMIT"
            echo ""
            echo "Please update and publish the item data, then commit its version and Shadow ref:"
            echo "  bun run update-items"
            echo "  shadow publish"
            echo ""
            exit 1
          fi

          echo "items.json is up to date."

  build:
    needs: check-items
    runs-on: ubuntu-latest
    env:
      VITE_SITE_TARGET: global
    outputs:
      site-target: ${{ env.VITE_SITE_TARGET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Shadow
        uses: ./.github/actions/setup-shadow

      - name: Restore and publish items to TOS
        env:
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
          TOS_SECURITY_TOKEN: ${{ secrets.TOS_SECURITY_TOKEN }}
        run: |
          shadow restore
          shadow publish
          shadow check --remote

      - name: Check public item data access
        run: bun run scripts/check-items-access.ts

      - name: Test
        run: bun run test

      - name: Build international site
        run: bun run build
        env:
          BASE_URL: /

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Upload server artifact
        # 国内站需单独构建 cn 产物，不能复用当前的国际产物。
        if: ${{ env.VITE_SITE_TARGET == 'cn' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: app/dist
          retention-days: 7

  deploy-server:
    # 保留服务器部署配置，待国内构建接入后再启用。
    if: ${{ needs.build.outputs.site-target == 'cn' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download server artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to market.icexiv.top
        run: |
          rsync -rlt --delete --delay-updates --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ azurice@82.156.196.54:/srv/market.icexiv.top/www/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

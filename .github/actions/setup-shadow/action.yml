name: Setup Shadow
description: Install the pinned Shadow CLI
runs:
  using: composite
  steps:
    - name: Cache Shadow binary
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/shadow
        key: shadow-${{ runner.os }}-${{ runner.arch }}-7a357b12984e2f13aab7259391e98a729d99e67f
    - name: Install Shadow
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --git https://github.com/AzurIce/shadow --rev 7a357b12984e2f13aab7259391e98a729d99e67f --locked -j 2
